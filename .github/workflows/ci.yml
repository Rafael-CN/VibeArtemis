name: CI

# Substitui o appveyor.yml, que apontava para um SDK que não existe mais e cujo
# `connectedCheck` era no-op (não há app/src/androidTest/).
on:
  push:
    branches: [dev, moonlight-noir]
  pull_request:
  workflow_dispatch:

concurrency:
  # Um push novo no mesmo branch cancela a execução anterior — não vale gastar
  # minutos compilando um commit que já foi substituído.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build e testes
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive # moonlight-common-c; sem isso o NDK não compila
          fetch-depth: 0        # o codemap compara com o histórico

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar NDK
        run: sdkmanager --install "ndk;27.0.12077973"

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Testa os próprios hooks. Fica fora do validate.mjs porque valida a
      # infraestrutura de agentes, não o app.
      - name: Hooks
        run: node tools/test-hooks.mjs

      # O gate inteiro num passo só: mapas, fronteira JNI, build e testes, na ordem
      # em que falham mais barato primeiro. É o MESMO comando que roda na máquina do
      # dev e no hook de Stop — ter dois caminhos diferentes é como o gate local e o
      # do CI divergem até alguém dizer "mas passa aqui".
      #
      # É também o que distingue falha nova das 5 que já vinham quebradas do upstream
      # (tools/test-baseline.json). Chamar o Gradle direto aqui reprovaria todo commit
      # por dívida herdada, e em uma semana ninguém mais olharia para o CI.
      - name: Gate de qualidade
        run: node tools/validate.mjs

      - name: Lint
        run: ./gradlew :app:lintNonRoot_gameDebug --console=plain
        continue-on-error: true # herdamos avisos do upstream; não bloqueia ainda

      - name: Publicar relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-*.html
          retention-days: 14
          if-no-files-found: ignore

      - name: APK de debug
        uses: actions/upload-artifact@v4
        with:
          name: vibeartemis-debug
          path: app/build/outputs/apk/nonRoot_game/debug/*.apk
          retention-days: 14
          if-no-files-found: warn
