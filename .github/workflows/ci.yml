name: CI

# Substitui o appveyor.yml, que apontava para um SDK que não existe mais e cujo
# `connectedCheck` era no-op (não há app/src/androidTest/).
on:
  push:
    branches: [dev, moonlight-noir]
  pull_request:
  workflow_dispatch:

concurrency:
  # Um push novo no mesmo branch cancela a execução anterior — não vale gastar
  # minutos compilando um commit que já foi substituído.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build e testes
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive # moonlight-common-c; sem isso o NDK não compila
          fetch-depth: 0        # o codemap compara com o histórico

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar NDK
        run: sdkmanager --install "ndk;27.0.12077973"

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Rápido e sem custo de Gradle: se a fronteira JNI estiver quebrada, falha
      # em segundos em vez de depois de compilar o NDK inteiro.
      - name: Integridade da fronteira JNI
        run: node tools/codemap/jni-check.mjs

      - name: Mapas de código atualizados
        run: node tools/codemap/codemap.mjs --check

      - name: Hooks
        run: node tools/test-hooks.mjs

      - name: Build (debug)
        run: ./gradlew :app:assembleNonRoot_gameDebug --console=plain

      - name: Testes unitários
        run: ./gradlew :app:testNonRoot_gameDebugUnitTest --console=plain

      - name: Lint
        run: ./gradlew :app:lintNonRoot_gameDebug --console=plain
        continue-on-error: true # herdamos avisos do upstream; não bloqueia ainda

      - name: Publicar relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-*.html
          retention-days: 14
          if-no-files-found: ignore

      - name: APK de debug
        uses: actions/upload-artifact@v4
        with:
          name: vibeartemis-debug
          path: app/build/outputs/apk/nonRoot_game/debug/*.apk
          retention-days: 14
          if-no-files-found: warn
